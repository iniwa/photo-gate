name: docker-ci

on:
  push:
    branches: [main]
    tags: ['sync-v*']
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/pyproject.toml
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall src

  # Runs the suite against the exact libvips inside the published base
  # image. Catches libvips-version-specific behavior (e.g. bookworm 8.14
  # re-synthesizing EXIF at save time) that host-installed libvips misses.
  container-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build test image with runtime libvips
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/
          target: test
          load: true
          tags: photo-gate-sync-test:local
      - name: Run test suite inside the container
        run: docker run --rm photo-gate-sync-test:local

  release:
    needs: [test, container-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sync-v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: Derive version and short SHA from tag
        run: |
          ref="${GITHUB_REF#refs/tags/sync-v}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/iniwa/photo-gate-sync:${{ steps.version.outputs.version }}
            ghcr.io/iniwa/photo-gate-sync:sha-${{ steps.version.outputs.sha_short }}

# NOTE: a portainer-update job (stack redeploy webhook after release) used
# to live here. Removed 2026-06-12: stack webhooks are a Portainer
# Business Edition feature and this deployment runs Community Edition.
# Releases are applied by manually bumping the image tag in the stack
# (see docs/operations/rollback.md and deploy-log.md).
