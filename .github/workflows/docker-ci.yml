name: docker-ci

on:
  push:
    branches: [main]
    tags: ['sync-v*']
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/pyproject.toml
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall src

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sync-v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: Derive version and short SHA from tag
        run: |
          ref="${GITHUB_REF#refs/tags/sync-v}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/iniwa/photo-gate-sync:${{ steps.version.outputs.version }}
            ghcr.io/iniwa/photo-gate-sync:sha-${{ steps.version.outputs.sha_short }}

  portainer-update:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sync-v')
    steps:
      - id: gate
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Portainer webhook not configured; skipping update."
          fi
      - if: steps.gate.outputs.update == 'true'
        name: Trigger Portainer redeploy webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
