name: workers-ci

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/workers-ci.yml'
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/workers-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: workers

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Checkout must come first: the workflow-level working-directory (workers)
      # does not exist until the repository is checked out, and run steps fail
      # to start if their working directory is missing.
      - uses: actions/checkout@v4
      - id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not configured; skipping deploy."
          fi
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      # Additive/non-destructive migrations only (approved default in
      # docs/fable/autonomy-contract.md). Applied before deploy so the new
      # Worker never runs against a schema older than it expects.
      - if: steps.gate.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply photo-gate --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.gate.outputs.deploy == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
