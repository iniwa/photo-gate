name = "photo-gate"
main = "src/index.tsx"
compatibility_date = "2026-06-09"
# Resource identifiers below are not secrets (see docs/operations/bootstrap.md).
account_id = "aee08afd4343ef45ca4f96d588528bbc"

[assets]
directory = "public"
binding = "ASSETS"

# Daily expired-session cleanup (UTC; 18:00 UTC = 03:00 JST).
[triggers]
crons = ["0 18 * * *"]

# Approved binding names (docs/fable/autonomy-contract.md): DB, PHOTO_BUCKET.
# Provisioned 2026-06-11, region APAC.
[[d1_databases]]
binding = "DB"
database_name = "photo-gate"
database_id = "de77cb73-497a-4a41-bd1c-151fd907be3f"

[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "photo-gate"

# These namespace IDs are intentionally unique to this Worker/account pair.
# The account limiter protects repeated guesses for one submitted ID; the
# network limiter limits high-cardinality unknown-ID attempts before PBKDF2.
[[ratelimits]]
name = "LOGIN_ACCOUNT_RATE_LIMIT"
namespace_id = "487013621"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "LOGIN_NETWORK_RATE_LIMIT"
namespace_id = "487013622"

  [ratelimits.simple]
  limit = 30
  period = 60
